name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Add login deep link
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="com.linktetris.app" android:host="auth"/></intent-filter>'
          i=s.index('</activity>')
          open(p,'w',encoding='utf-8').write(s[:i]+f+s[i:])
          PY
          grep -c "com.linktetris.app" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Apply app icon
        run: |
          RES=android/app/src/main/res
          find $RES -name 'ic_launcher*' -delete
          cp -r icons/* $RES/
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tetris-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
